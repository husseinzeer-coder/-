<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الانتقال إلى إدارة تقارير الحفاظ</title>
<meta name="robots" content="noindex">
<style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7f4;color:#173c36;margin:0;display:grid;place-items:center;min-height:100vh;text-align:center;padding:22px}main{background:white;max-width:520px;padding:30px;border:1px solid #d7e6dd;border-radius:16px}a{color:#09614c;font-weight:bold}</style>
<script>
  // روابط meeting.html القديمة تفتح مساحة العمل الموحدة بدل صفحة ثانية.
  const destination=new URL('./index.html',location.href);
  for(const [key,value] of new URLSearchParams(location.search))destination.searchParams.set(key,value);
  destination.searchParams.set('view','meeting');
  location.replace(destination.href);
</script>
</head>
<body><main><h1>انتقل تقرير اللقاء إلى مساحة العمل الموحدة</h1><p>جميع التقارير أصبحت تُدار من صفحة واحدة.</p><a href="./index.html?view=meeting">افتح إدارة التقارير</a></main></body>
</html>
